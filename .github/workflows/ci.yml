name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: synthesift_test
          POSTGRES_USER: synthesift
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthesift -d synthesift_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DJANGO_SECRET_KEY: ci-test-only-secret
      DATABASE_URL: postgresql://synthesift:ci_only@127.0.0.1:5432/synthesift_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Ruff
        run: ruff check apps/api
      - name: Django system checks
        working-directory: apps/api
        run: python manage.py check && python manage.py makemigrations --check --dry-run
      - name: Backend tests
        working-directory: apps/api
        run: pytest --maxfail=1 -q
      - name: Validate runtime OpenAPI
        working-directory: apps/api
        run: python manage.py spectacular --file ../../contracts/openapi.generated.yaml --validate
      - name: Compare reviewed API surface
        run: python scripts/check_contract.py contracts/openapi.yaml contracts/openapi.generated.yaml
      - name: Contract verifier tests
        run: python -m unittest discover -s tests/unit -p "test_*.py" -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Unit tests
        working-directory: apps/web
        run: npm test
      - name: Build
        working-directory: apps/web
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
        run: npm run build

  integration:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start containerized stack
        run: cp .env.example .env && docker compose up --build --detach --wait --wait-timeout 240
      - name: Verify HTTP surface
        run: bash scripts/smoke.sh
      - name: Execute a real background task
        run: docker compose exec -T api python manage.py verify_worker --timeout 15
      - name: Collect logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down --remove-orphans
