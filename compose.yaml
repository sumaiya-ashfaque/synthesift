name: synthesift

x-api-service: &api-service
  build:
    context: ./apps/api
  env_file:
    - .env
  environment:
    APP_ENV: development
    DATABASE_URL: postgresql://${POSTGRES_USER:-synthesift}:${POSTGRES_PASSWORD:-synthesift_local_only}@db:5432/${POSTGRES_DB:-synthesift}
    REDIS_URL: redis://redis:6379/0
    DATASET_STORAGE_ROOT: /data/datasets
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    DJANGO_ALLOWED_HOSTS: api,localhost,127.0.0.1
  restart: unless-stopped
  volumes:
    - datasets_data:/data/datasets

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synthesift}
      POSTGRES_USER: ${POSTGRES_USER:-synthesift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthesift_local_only}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    <<: *api-service
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-service
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  worker:
    <<: *api-service
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=1", "--hostname=synthesift@%h"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout=3 | grep -q pong"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 25s

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 15
      start_period: 15s
    restart: unless-stopped

volumes:
  db_data:
    name: ${DB_VOLUME_NAME:-synthesift_db_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-synthesift_redis_data}
  datasets_data:
    name: ${DATASET_VOLUME_NAME:-synthesift_datasets_data}
